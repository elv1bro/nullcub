<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Знак NULL GRAVITY: дрон N0 (шар-корпус, чёрный экран-лицо с глазами-«таблетками», уши-плавники, антенна) на орбите:
       наклонное кольцо гравитации и три оторванные детали вокруг него (docs/plan-demo/BRAND.md). -->
  <defs>
    <radialGradient id="body" cx="38%" cy="30%" r="80%">
      <stop offset="0" stop-color="#fff6dc"/><stop offset="0.55" stop-color="#f1e0b4"/><stop offset="1" stop-color="#b9a173"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5ce1ff" stop-opacity="0.9"/><stop offset="1" stop-color="#5ce1ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2cf"/><stop offset="1" stop-color="#e9cf8f"/>
    </linearGradient>
    <clipPath id="front"><rect x="0" y="128" width="256" height="128"/></clipPath>
  </defs>
  <!-- задняя половина орбиты -->
  <g transform="rotate(-22 128 134)">
    <ellipse cx="128" cy="134" rx="116" ry="34" fill="none" stroke="#ff8a2b" stroke-width="7" stroke-opacity="0.55"/>
  </g>
  <!-- уши-плавники -->
  <path d="M96 78 C70 44 78 14 104 8 C102 34 112 56 122 74 Z" fill="url(#ear)" stroke="#f2a93b" stroke-width="5" stroke-linejoin="round"/>
  <path d="M160 78 C186 44 178 14 152 8 C154 34 144 56 134 74 Z" fill="url(#ear)" stroke="#f2a93b" stroke-width="5" stroke-linejoin="round"/>
  <!-- антенна -->
  <path d="M128 66 L128 30" stroke="#3a312a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="128" cy="26" r="8" fill="#ff8a2b"/>
  <!-- корпус -->
  <circle cx="128" cy="134" r="80" fill="url(#body)" stroke="#3a312a" stroke-width="6"/>
  <path d="M60 112 A80 80 0 0 1 98 62" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
  <!-- боковые объективы -->
  <circle cx="52" cy="140" r="12" fill="#1c2a33" stroke="#3a312a" stroke-width="4"/><circle cx="52" cy="140" r="5" fill="#5ce1ff"/>
  <circle cx="204" cy="140" r="12" fill="#1c2a33" stroke="#3a312a" stroke-width="4"/><circle cx="204" cy="140" r="5" fill="#5ce1ff"/>
  <!-- экран-лицо -->
  <circle cx="128" cy="134" r="56" fill="#2a2420" stroke="#3a312a" stroke-width="4"/>
  <circle cx="128" cy="134" r="46" fill="#0a0c11"/>
  <circle cx="128" cy="134" r="46" fill="none" stroke="#5ce1ff" stroke-opacity="0.18" stroke-width="3"/>
  <ellipse cx="108" cy="134" rx="24" ry="30" fill="url(#glow)"/><ellipse cx="148" cy="134" rx="24" ry="30" fill="url(#glow)"/>
  <rect x="100" y="114" width="16" height="40" rx="8" fill="#9aeeff"/>
  <rect x="140" y="114" width="16" height="40" rx="8" fill="#9aeeff"/>
  <!-- болты обоймы -->
  <g fill="#8a7a63"><circle cx="128" cy="82" r="3"/><circle cx="128" cy="186" r="3"/><circle cx="76" cy="134" r="3"/><circle cx="180" cy="134" r="3"/></g>
  <!-- двигатель-стабилизатор -->
  <ellipse cx="128" cy="222" rx="30" ry="9" fill="url(#glow)"/>
  <rect x="112" y="210" width="32" height="10" rx="5" fill="#3a312a"/>
  <!-- передняя половина орбиты -->
  <g clip-path="url(#front)"><g transform="rotate(-22 128 134)">
    <ellipse cx="128" cy="134" rx="116" ry="34" fill="none" stroke="#ff8a2b" stroke-width="7"/>
  </g></g>
  <!-- оторванные детали на орбите -->
  <g stroke="#3a312a" stroke-width="4" stroke-linejoin="round">
    <rect x="20" y="168" width="22" height="22" rx="4" fill="#ffb347" transform="rotate(18 31 179)"/>
    <rect x="212" y="94" width="18" height="18" rx="3" fill="#ffb347" transform="rotate(-24 221 103)"/>
    <rect x="196" y="204" width="14" height="14" rx="3" fill="#5ce1ff" transform="rotate(35 203 211)"/>
  </g>
</svg>
